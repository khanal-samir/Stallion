services:
  postgres:
    image: postgres:15
    container_name: stallion-postgres-dev
    environment:
      POSTGRES_USER: stallion
      POSTGRES_PASSWORD: stallion123
      POSTGRES_DB: stallion
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
